services:
  contrat-app:
    image: ghcr.io/didier57/contrat:latest
    container_name: contrat-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3002}:3002"
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-avec-une-longue-cle-secrete}
      - PORT=3002
      - DB_PATH=/data/contrats.db
      - TZ=Europe/Paris
    volumes:
      # Chemin absolu du dossier de données sur le NAS (contient la BDD)
      - ${DATA_DIR:-/volume1/docker/contrat-app/data}:/data